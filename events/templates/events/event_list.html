{% extends 'base.html' %}

{% block content %}
  <hr>

  <h2>My Events</h2>
  <p><a href="{% url 'event_create' %}">Create Event</a></p>

  {% for event in events %}
    <div>
      <h3>{{ event.title }}</h3>
      <p>{{ event.description }}</p>
      <p>Date: {{ event.date }}</p>

      <a href="{% url 'event_detail' event.pk %}">View Details</a> |
      <a href="{% url 'event_update' event.pk %}">Edit</a> |
      <a href="{% url 'event_delete' event.pk %}">Delete</a>
    </div>
    <hr>
  {% empty %}
    <p>No events found.</p>
  {% endfor %}
{% endblock %}
